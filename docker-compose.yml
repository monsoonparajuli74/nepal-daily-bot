services:
  bot:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://everyday:everyday@postgres:5432/everyday_nepal
      AUTO_CREATE_TABLES: "true"
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: everyday
      POSTGRES_PASSWORD: everyday
      POSTGRES_DB: everyday_nepal
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U everyday -d everyday_nepal"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:

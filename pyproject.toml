[project]
name = "everyday-nepal"
version = "1.0.0"
description = "Sajilo Nepal - a free daily utility Telegram bot for Nepal and the Nepali diaspora."
requires-python = ">=3.10"

[tool.ruff]
line-length = 120
target-version = "py310"
exclude = ["migrations/versions", ".venv", "build", "dist"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM"]
ignore = ["E501", "B008", "UP038"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011", "SIM117"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
